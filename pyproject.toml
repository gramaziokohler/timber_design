# ============================================================================
# Workspace root
#
# This repository hosts three independently released distributions:
#
#   packages/compas_timber_rules      joint-rule workflow
#   packages/compas_timber_populator  PanelPopulator (+ 2D connection solver)
#   packages/compas_timber_gh         Grasshopper helpers + core / populator Yak packages
#
# The root project below is a private, never-published meta package that pulls
# in all three, so `pip install -e .[dev]` (used by the compas-actions build/docs
# actions) and `uv sync --all-packages` both give a complete dev environment.
# ============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timber_design"
version = "0.0.0"
description = "Development workspace for compas_timber_rules, compas_timber_populator and compas_timber_gh"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "compas_timber_rules @ {root:uri}/packages/compas_timber_rules",
    "compas_timber_populator @ {root:uri}/packages/compas_timber_populator",
    "compas_timber_gh @ {root:uri}/packages/compas_timber_gh",
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
    "compas_invocations2[mkdocs]>=1.0.2",
    "mkdocs-panzoom-plugin",
    "invoke >=0.14",
    "ruff",
    "twine",
    "pytest-mock",
    "pytest>=8.0",
    "build",
    "pytest-cov",
    "pytest-randomly",
]

gh = [
    "compas_invocations2",
    "tomlkit",
    "pythonnet",
]

[project.urls]
Homepage = "https://gramaziokohler.github.io/timber_design"
Documentation = "https://gramaziokohler.github.io/timber_design"
Repository = "https://github.com/gramaziokohler/timber_design"
Changelog = "https://github.com/gramaziokohler/timber_design/blob/main/CHANGELOG.md"
Issues = "https://github.com/gramaziokohler/timber_design/issues"
Forum = "https://forum.compas-framework.org/"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
compas_timber_rules = { workspace = true }
compas_timber_populator = { workspace = true }
compas_timber_gh = { workspace = true }

# ============================================================================
# Unittest configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "packages/compas_timber_rules/tests",
    "packages/compas_timber_populator/tests",
]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--import-mode=importlib",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

# ============================================================================
# Formatting and linting
# ============================================================================

[tool.black]
extend-exclude = '(/[a-zA-Z\./]*[\s]?)'  # exclude everything, black should be removed..

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"**/tests/*" = ["I001"]
"tasks.py" = ["I001"]
"packages/compas_timber_gh/components/*/*/code.py" = ["F821"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas_timber_rules", "compas_timber_populator", "compas_timber_gh"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
